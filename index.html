<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Angelynn Arts</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #F3DEFA;
    overflow: hidden;
    touch-action: pan-y;
}

/* CONTAINER */
.iframe-container {
    position: fixed;
    top: -65px; /* hide Wix banner */
    left: 50%;
    width: 360px; /* match your phone width */
    height: calc(100% + 65px);
    transform: translateX(-50%);
    overflow: hidden;
}

/* IFRAME */
iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* SCALE UP slightly to fill screen nicely */
@media (max-width: 400px) {
    .iframe-container {
        transform: translateX(-50%) scale(1.08);
        transform-origin: top center;
    }
}
</style>
</head>

<body>
<div class="iframe-container">
    <iframe src="https://angelynnarts.wixsite.com/angelynnarts" allowfullscreen></iframe>
</div>
</body>
</html>
