<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angelynn Arts</title>

<style>
/* ===== FONTS (fixed GitHub raw links — update filenames if needed) ===== */
@font-face {
  font-family: 'BodoniModa';
  src: url('https://raw.githubusercontent.com/angelynnarts/mysite-fonts/main/BodoniModa.ttf') format('truetype');
}

@font-face {
  font-family: 'EloquentJF';
  src: url('https://raw.githubusercontent.com/angelynnarts/mysite-fonts/main/EloquentJF.ttf') format('truetype');
}

/* ===== BASE ===== */
body {
  margin: 0;
  background-color: #F3DEFA;
  font-family: 'BodoniModa', serif;
}

/* ===== HERO SECTION ===== */
.hero {
  height: 100vh;
  background: url('https://static.wixstatic.com/media/your-image.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero h1 {
  font-size: 48px;
  color: #000;
}

/* ===== SECTION ===== */
.section {
  padding: 60px 20px;
  text-align: center;
}

.section img {
  max-width: 100%;
  height: auto;
}

/* ===== BUTTON ===== */
.button {
  display: inline-block;
  padding: 12px 24px;
  background-color: #000;
  color: #fff;
  text-decoration: none;
  margin-top: 20px;
}

/* ===== MOBILE (match Wix stacking style) ===== */
@media (max-width: 768px) {
  .hero h1 {
    font-size: 28px;
  }

  .section {
    padding: 40px 15px;
  }
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>Angelynn Arts</h1>
</section>

<!-- CONTENT -->
<section class="section">
  <img src="https://static.wixstatic.com/media/your-image2.jpg">
  <p>Artwork description or text here</p>
  <a href="#" class="button">View More</a>
</section>

</body>
</html>
