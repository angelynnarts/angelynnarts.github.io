<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Angelynn Arts</title>

<style>
/* RESET */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* 🔥 locks ALL scrolling */
    background-color: #F3DEFA;
}

/* CONTAINER */
.iframe-container {
    position: fixed;
    top: -65px; /* hide Wix banner */
    left: 0;
    width: 100%;
    height: calc(100% + 65px);
    overflow: hidden; /* 🔥 prevents internal panning */
}

/* IFRAME */
iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
}

/* EXTRA MOBILE LOCK */
body {
    touch-action: none; /* disables swipe panning */
}
</style>

</head>

<body>
<div class="iframe-container">
    <iframe src="https://angelynnarts.wixsite.com/angelynnarts" allowfullscreen></iframe>
</div>
</body>
</html>
