<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Angelynn Arts</title>

<style>
/* RESET + BACKGROUND */
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #F3DEFA;
    overflow: hidden;              /* prevents horizontal movement */
    touch-action: pan-y;           /* allow only vertical scrolling */
}

/* IFRAME CONTAINER */
.iframe-container {
    position: fixed;
    top: -65px;                    /* hides Wix banner */
    left: 0;
    width: 100%;
    height: calc(100% + 65px);
    overflow: hidden;              /* prevents internal overflow */
}

/* IFRAME */
iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}
</style>
</head>

<body>
<div class="iframe-container">
    <iframe src="https://angelynnarts.wixsite.com/angelynnarts" allowfullscreen></iframe>
</div>
</body>
</html>
